name: slim-bundle

# Build the talos bundle natively on every target, then install and
# smoke-test it the way a client would (slim/smoke_test.py). Tags v* publish
# the bundles as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slim-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s slim/tests -v

  bundle:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-15-intel
          - target: darwin-arm64
            os: macos-latest
          - target: linux-x64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: linux-x64-musl
            os: ubuntu-latest
            container: alpine:3.22
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # Read by the signing step's `if` (a step's own env is not visible there).
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 != '' }}
    steps:
      - name: Alpine prerequisites
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash python3 git github-cli tar zstd build-base curl
      - uses: actions/checkout@v4
        with:
          # build_bundle.py stamps the version from `git describe`: it needs every commit and
          # tag, not every blob (a full clone of this fork stalled the alpine job for 15+ min).
          fetch-depth: 0
          filter: blob:none
      - name: Host python
        id: py
        run: |
          for c in python3 python; do
            if command -v $c >/dev/null && $c -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then echo "bin=$c" >> "$GITHUB_OUTPUT"; break; fi
          done
      - name: Fetch hermes-slim/wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p wheels
          gh release download latest -R hermes-slim/wheels -D wheels --pattern '*.whl' || echo "no extra wheels"
          ls -l wheels
      - name: Stage bundle
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --wheels wheels --work "$RUNNER_TEMP/hs-work" --stage-only
      # Smart App Control (on by default on new Windows 11 installs) refuses unsigned
      # binaries, the wheels' .pyd/.dll included. The interpreter is python.org's
      # (PSF-signed); everything stage listed as unsigned is signed here with our
      # Azure Artifact Signing certificate profile.
      - name: Sign Windows binaries
        if: matrix.target == 'win32-x64' && env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba  # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-catalog: ${{ runner.temp }}/hs-work/unsigned.txt
          file-digest: SHA256
          timestamp-digest: SHA256
      - name: Verify every Windows binary is validly signed
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse -File "$env:RUNNER_TEMP/hs-work/talos" -Include *.exe,*.dll,*.pyd |
            Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          $bad | ForEach-Object { Write-Host "$($_.Status)  $($_.Path)" }
          if ($bad) {
            # Releases must run under Smart App Control; PR builds without the signing secrets only warn.
            if ($env:GITHUB_REF -like 'refs/tags/v*') { throw "$(@($bad).Count) binaries are not validly signed" }
            Write-Host "::warning::$(@($bad).Count) binaries unsigned: this bundle will not run under Smart App Control"
          }
      # Developer ID signing + notarization so Gatekeeper runs the bundle without
      # the installer having to strip the quarantine flag.
      - name: Sign and notarize macOS binaries
        if: startsWith(matrix.target, 'darwin-') && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_DEVELOPER_ID_APP_P12: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APPLE_DEVELOPER_ID_APP_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_USER: ${{ secrets.APPLE_NOTARY_USER }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: sh slim/sign_macos.sh "$RUNNER_TEMP/hs-work/talos"
      - name: Package bundle
        run: ${{ steps.py.outputs.bin }} slim/build_bundle.py --target ${{ matrix.target }} --out dist --work "$RUNNER_TEMP/hs-work" --package-only
      - name: Static zstd for clients without one
        if: matrix.target == 'linux-x64-musl'
        run: sh slim/build_zstd.sh dist
      - name: Smoke test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: ${{ steps.py.outputs.bin }} slim/smoke_test.py "$(ls dist/talos-*-${{ matrix.target }}.zip dist/talos-*-${{ matrix.target }}.tar.zst 2>/dev/null | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: talos-${{ matrix.target }}
          path: dist/
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" -R "${{ github.repository }}" --generate-notes dist/*
